name: PagaFácil CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint con flake8
        run: flake8 services/ --max-line-length=100

      - name: Ejecutar tests
        run: pytest tests/ -v

  deploy-staging:
    name: Deploy Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Deploy a Staging
        run: |
          echo "🚀 Desplegando en STAGING..."
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "✅ Staging actualizado correctamente"

  deploy-production:
    name: Deploy Producción
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Leer versión
        id: version
        run: echo "VERSION=$(python3 -c \"import json; v=json.load(open('version.json')); print(f\"{v['major']}.{v['minor']}.{v['patch']}\")")" >> $GITHUB_OUTPUT
      - name: Deploy a Producción
        run: |
          echo "🚀 Desplegando en PRODUCCIÓN v${{ steps.version.outputs.VERSION }}..."
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "✅ Producción actualizada correctamente"
