name: PagaFácil — DEV Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pagafacil

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar estructura
        run: |
          for service in auth billing payments conciliation notifications reports; do
            [ -f "services/$service/main.py" ] && echo "OK: $service" || (echo "MISSING: $service" && exit 1)
          done
      - name: Lint con flake8
        run: flake8 services/ --max-line-length=100 --extend-ignore=E302,E303
      - name: Pruebas unitarias
        run: pytest tests/ -v --tb=short --cov=services --cov-report=term-missing

  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y Push imagen DEV
        run: |
          VERSION=$(python3 -c "import json; v=json.load(open('version.json')); print(f\"{v['major']}.{v['minor']}.{v['patch']}\")")
          docker build -t ${{ env.IMAGE }}:dev -t ${{ env.IMAGE }}:$VERSION-dev .
          docker push ${{ env.IMAGE }}:dev
          docker push ${{ env.IMAGE }}:$VERSION-dev
          echo "Imagen DEV publicada: ${{ env.IMAGE }}:dev"

  acceptance-test-dev:
    name: Acceptance Test DEV
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas de aceptacion en DEV
        run: |
          python3 -c "
          from services.auth.main import authenticate, assign_role
          from services.billing.main import generate_invoice, cancel_invoice
          from services.payments.main import process_payment, check_payment_status
          from services.conciliation.main import reconcile
          from services.notifications.main import send_notification
          from services.reports.main import generate_report

          assert authenticate('admin@pagafacil.co', '1234')['status'] == 'ok'
          assert assign_role('user1', 'residente')['role'] == 'residente'
          assert generate_invoice('RES-001', 250000, 'administracion')['status'] == 'generada'
          assert cancel_invoice('INV-001', 'error')['status'] == 'cancelada'
          assert process_payment('INV-001', 'BANCOLOMBIA', 250000)['status'] == 'pending'
          assert check_payment_status('TXN-001')['status'] == 'approved'
          assert reconcile('TXN-001', {'code': '00'})['reconciled'] == True
          assert send_notification('RES-001', 'Pago recibido', 'email')['sent'] == True
          assert generate_report('EDIF-001', '2026-08')['building_id'] == 'EDIF-001'
          print('Acceptance Test DEV OK')
          "

  deploy-qa:
    name: Deploy QA
    needs: acceptance-test-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y Push imagen QA
        run: |
          VERSION=$(python3 -c "import json; v=json.load(open('version.json')); print(f\"{v['major']}.{v['minor']}.{v['patch']}\")")
          docker build -t ${{ env.IMAGE }}:qa -t ${{ env.IMAGE }}:$VERSION-qa .
          docker push ${{ env.IMAGE }}:qa
          docker push ${{ env.IMAGE }}:$VERSION-qa
          echo "Imagen QA publicada: ${{ env.IMAGE }}:qa"

  acceptance-test-qa:
    name: Acceptance Test QA
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Correr contenedor QA y validar
        run: |
          docker pull ${{ env.IMAGE }}:qa
          docker run --rm ${{ env.IMAGE }}:qa
          echo "Acceptance Test QA OK - contenedor QA validado"
